name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  quality-and-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Linting tools
      run: |
        pip install ruff

    - name: Run Ruff Check (Linting)
      run: ruff check .

    - name: Build Docker Image
      run: |
        docker build -t analyse-compta:${{ github.sha }} .

    - name: Run Pytest Tests
      run: |
        docker run --rm analyse-compta:${{ github.sha }} python -m pytest tests/

    - name: Test API
      run: |
        docker run -d -p 8000:8000 --name test_api analyse-compta:${{ github.sha }}

        for i in {1..30}; do
          if curl -s http://localhost:8000/ > /dev/null; then
            echo "API is up"
            break
          fi
          sleep 1
        done

        curl -f http://localhost:8000/

        docker stop test_api